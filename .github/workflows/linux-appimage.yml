name: Linux AppImage

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/linux-appimage.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2 file

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x gradlew packaging/build-appimage.sh
          packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Halftone-AppImage
          path: desktop/build/appimage/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/appimage/*.AppImage
